spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    baseline-on-migrate: true
    baseline-description: "Initial baseline"
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 3600000 # 1 hour
  cors:
    allowed-origins: ${CORS_ORIGINS:https://code-kingdom.onrender.com}

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

logging:
  level:
    root: WARN
    com.aleksdev.code.kingdom: INFO
    org.flywaydb: INFO
  file:
    name: logs/code-kingdom.log
    max-size: 10MB
    max-history: 10
